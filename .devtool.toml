# Scheduler only overlaps proven read-only jobs; Gradle workflows retain their
# explicit dependencies and are limited to one expensive node at a time.
[workspace.scheduler]
parallel = true
max_parallel_nodes = 4
max_gradle_nodes = 1
max_dotnet_nodes = 1

[execution]
environment = "auto"
chroot_name = "androidos"

# Prefer in-place Termux builds to avoid an unnecessary chroot copy/bind on ARM64.
# Override with `devtool --chroot androidos ...` if local SDK providers require it.
[targets.cinderbox]
runner = "android"
platform = "android"
root = "."
execution_environment = "auto"
inputs = [".devtool.toml", "devtoolw", "gradlew", "gradle/**", "settings.gradle.kts", "build.gradle.kts", "gradle.properties", "app/**", "scripts/devtool/**", "docs/devtool/**", ".github/workflows/**"]
outputs = ["app/build/**", "build/**"]

[targets.cinderbox.android]
variant = "debug"
aapt2_provider = "auto"
sdk_provider = "auto"
prefer_native_termux = true
instrumentation = "disabled"

[targets.cinderbox.android.storage]
auto_cleanup = "safe"
min_free_mb = 4096
target_free_mb = 6144
managed_gradle_retention = 2
manage_gradle_user_cache = false
keep_provider_downloads = false
cleanup_after_build = true

[targets.cinderbox.gradle]
max_workers = 2
parallel = false
no_daemon = false
daemon_idle_timeout_ms = 900000
build_cache = true
structured_events = false
args = ["-Dorg.gradle.vfs.watch=false"]

# Actual Gradle tasks from the checked-in :app project. No invented composite task.
[targets.cinderbox.tasks]
build = [":app:assembleDebug"]
test = [":app:testDebugUnitTest"]
lint = [":app:lintDebug"]
clean = [":app:clean"]
instrumentation = [":app:connectedDebugAndroidTest"]

[targets.cinderbox.artifacts]
# Unit-test and lint jobs produce no APK; the debug-build job has its own verification gate.
required = false
external_verification = "auto"

[targets.cinderbox.validation]
android_safe = true
split_gradle = false
max_workers = 2
cpu_limit = 2
parallel = false
no_daemon = false
low_priority = false
memory_guard_mb = 0
gradle_heap_mb = 1152
gradle_metaspace_mb = 512
gradle_packaging_metaspace_mb = 640
gradle_lint_metaspace_mb = 640
affected_module_lint = true

[targets.cinderbox.validation.phases]
preflight = []
dependencies = []
compile = []
resources = []
unit-test = [":app:testDebugUnitTest"]
package = [":app:assembleDebug"]
lint = [":app:lintDebug"]

# This job is cheap and works even before JDK, Gradle, or the Android SDK exists.
[targets.cinderbox.jobs.security-contract]
runner = "command"
execution_environment = "host"
command = ["python3", "scripts/devtool/check_security_contract.py"]
env = { PYTHONDONTWRITEBYTECODE = "1" }
inputs = ["app/src/main/AndroidManifest.xml", "app/src/main/java/com/sdvsync/fileaccess/**", "app/src/main/java/com/sdvsync/download/**", "scripts/devtool/check_security_contract.py"]
metadata = { read_only = true, area = "security", root_required = false }

# Source-only CI/Devtool contract checks: host/Termux Python, never Gradle.
[targets.cinderbox.jobs.storage-alias-source]
runner = "command"
execution_environment = "host"
command = ["python3", "-B", "-m", "unittest", "discover", "-s", "scripts/devtool", "-p", "test_storage_alias_source.py", "-v"]
inputs = ["app/src/main/java/com/sdvsync/local/PlatformStoragePaths.kt", "app/src/main/java/com/sdvsync/local/StoragePreflight.kt", "app/src/main/java/com/sdvsync/download/GameDownloadRecovery.kt", "scripts/devtool/test_storage_alias_source.py"]
metadata = { read_only = true, area = "storage-alias", root_required = false }

[targets.cinderbox.jobs.devtool-contract]
runner = "command"
execution_environment = "host"
command = ["python3", "-B", "scripts/devtool/cinderbox_devtool_audit.py", "--json"]
inputs = [".devtool.toml", "devtoolw", "gradle/wrapper/gradle-wrapper.properties", ".github/workflows/**", "scripts/devtool/cinderbox_devtool_audit.py"]
metadata = { read_only = true, area = "devtool-contract", device_required = false, root_required = false }

[targets.cinderbox.jobs.a05-source-regression]
runner = "command"
execution_environment = "host"
command = ["python3", "-B", "-m", "unittest", "discover", "-s", "scripts/devtool", "-p", "test_a05_*.py", "-q"]
inputs = ["scripts/devtool/a05_*.py", "scripts/devtool/test_a05_*.py", ".github/workflows/devtool-android-build.yml"]
metadata = { read_only = true, area = "a05-source", device_required = false, root_required = false }

[targets.cinderbox.jobs.a07-source-regression]
runner = "command"
execution_environment = "host"
command = ["python3", "-B", "-m", "unittest", "discover", "-s", "scripts/devtool", "-p", "test_a07_*.py", "-q"]
inputs = ["scripts/devtool/a07_*.py", "scripts/devtool/test_a07_*.py", ".github/workflows/devtool-android-build.yml"]
metadata = { read_only = true, area = "a07-source", device_required = false, root_required = false }

[targets.cinderbox.jobs.a10-source-regression]
