name: R45-R46 Audited UI and Privacy Contracts
on:
  pull_request:
    paths:
      - 'app/src/main/java/com/sdvsync/**'
      - 'app/src/test/java/com/sdvsync/ui/**'
      - 'scripts/devtool/r45*.py'
      - 'scripts/devtool/test_r45*.py'
      - '.devtool.toml'
      - '.github/workflows/r45-r46-audited.yml'
  push:
    branches: [master]
    paths:
      - 'app/src/main/java/com/sdvsync/**'
      - 'app/src/test/java/com/sdvsync/ui/**'
      - 'scripts/devtool/r45*.py'
      - 'scripts/devtool/test_r45*.py'
      - '.devtool.toml'
      - '.github/workflows/r45-r46-audited.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audited-ui-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Exact postconditions and all R45/R46 host tests
        run: |
          python3 -B scripts/devtool/r45a_patch.py --check
          python3 -B scripts/devtool/r45ui_patch.py --check
          python3 -B scripts/devtool/r45r2_patch.py --check
          python3 -B -m unittest discover -s scripts/devtool -p 'test_r45a_gate.py' -v
          python3 -B -m unittest discover -s scripts/devtool -p 'test_r45ui_gate.py' -v
          python3 -B -m unittest discover -s scripts/devtool -p 'test_r45r2_gate.py' -v
          python3 -B scripts/devtool/r45a_gate.py
          python3 -B scripts/devtool/r45ui_gate.py
          python3 -B scripts/devtool/r45r2_gate.py
      - name: Previously merged Material 3 and safety contracts
        run: |
          python3 -B scripts/devtool/r44b_patch.py --check
          python3 -B scripts/devtool/r44b_gate.py
          python3 -B scripts/devtool/r44_patch.py --check
          python3 -B scripts/devtool/r44_gate.py
          python3 -B scripts/devtool/r43d_patch.py --check
          python3 -B scripts/devtool/r43d_gate.py
          python3 -B scripts/devtool/r43c_gate.py
          python3 -B scripts/devtool/r43_policy_gate.py
          python3 -B scripts/devtool/r42_product_gate.py
      - name: Qualification boundaries
        run: |
          echo 'Host source qualification only; Build Debug APK owns compilation, unit tests, lint and signing.'
          echo 'No real Steam account, game files, device operations, or publication enabled.'
