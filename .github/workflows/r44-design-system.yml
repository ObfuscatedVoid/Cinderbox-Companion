name: R44 Material 3 Design Foundation Source Contracts
on:
  pull_request:
    paths:
      - 'app/src/main/java/com/sdvsync/ui/**'
      - 'app/src/test/java/com/sdvsync/ui/**'
      - 'scripts/devtool/r44_*.py'
      - 'scripts/devtool/test_r44_gate.py'
      - '.devtool.toml'
      - '.github/workflows/r44-design-system.yml'
  push:
    branches: [master]
    paths:
      - 'app/src/main/java/com/sdvsync/ui/**'
      - 'app/src/test/java/com/sdvsync/ui/**'
      - 'scripts/devtool/r44_*.py'
      - 'scripts/devtool/test_r44_gate.py'
      - '.devtool.toml'
      - '.github/workflows/r44-design-system.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: R44 exact postconditions and host unit tests
        run: |
          python3 -B scripts/devtool/r44_patch.py --check
          python3 -B -m unittest discover -s scripts/devtool -p 'test_r44_gate.py' -v
          python3 -B scripts/devtool/r44_gate.py
      - name: Preserve Cinderbox download, game and release boundaries
        run: |
          python3 -B scripts/devtool/r43d_patch.py --check
          python3 -B scripts/devtool/r43d_gate.py
          python3 -B scripts/devtool/r43c_patch.py --check
          python3 -B scripts/devtool/r43c_gate.py
          python3 -B scripts/devtool/r43b4_gate.py
          python3 -B scripts/devtool/r43_policy_gate.py
          python3 -B scripts/devtool/r42_product_gate.py
      - name: Evidence boundary
        run: |
          echo 'R44 source-only UI contract. Hosted Build Debug APK owns compilation, JVM tests, lint and debug signing.'
          echo 'No physical device, real Steam operation, release or publication was authorized.'
